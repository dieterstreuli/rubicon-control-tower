name: RUBICON Merge-Bruecke (Struktur -> Volume)

# Zieht Struktur-Aenderungen (Repo src/data) in die Live-Daten (GCS-Volume) nach, OHNE
# Live-Zustand zu zerstoeren: Stammdaten aus Repo, Transaktionsdaten unberuehrt, Misch
# (projekt.yaml/tasks.json) per Merge-by-Key. Details: DEPLOYMENT_GCP.md §10.
#
# Zwei Ausloeser:
#  A) automatisch NACH einem erfolgreichen Deploy, dessen Commit-SUBJECT (erste Zeile!)
#     den Marker [publish-data] traegt -> laeuft als AUTO: wendet automatisch an, WENN der
#     Merge 0 Konflikte hat (Normalfall: neue Struktur ohne Loeschungen); bei Konflikten
#     wird NICHT angewandt, sondern gehalten + gemeldet (nie stiller Apply). Bewusst nur die
#     erste Zeile: eine Prosa-Erwaehnung im Body soll NICHT triggern.
#  B) manuell (workflow_dispatch): apply=false = Dry-Run, apply=true = Backup + Anwenden
#     (erzwingt das Schreiben, auch bei Konflikten — bewusste menschliche Entscheidung).
#
# Der eigentliche Merge laeuft im Cloud-Run-Job rubicon-merge-job (Zugriff aufs Volume);
# dieser Workflow steuert Modus, Backup und fuehrt den Job aus.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Anwenden (schreibt ins Volume, mit Backup). Aus = nur Dry-Run/Vorschau."
        type: boolean
        default: false
  workflow_run:
    workflows: ["Deploy RUBICON to Cloud Run"]
    types: [completed]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: aixs-260106
  REGION: europe-west4
  BUCKET: aixs-rubicon-tower-data
  BACKUP_BUCKET: aixs-rubicon-tower-backup
  JOB: rubicon-merge-job
  WIF_PROVIDER: projects/646221535662/locations/global/workloadIdentityPools/github-actions/providers/rubicon-dst
  DEPLOY_SA: rubicon-deployer@aixs-260106.iam.gserviceaccount.com

jobs:
  merge:
    # Manuell IMMER; Auto nur bei erfolgreichem Deploy (der eigentliche Marker-Check laeuft
    # im Gate-Step unten, weil eine Prasenz-Pruefung auf die erste Zeile im if-Ausdruck nicht
    # moeglich ist).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Gate: entscheidet proceed (laeuft der Merge ueberhaupt?) + apply (schreiben?).
      - id: gate
        env:
          HEAD_MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=1" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.apply }}" = "true" ]; then
              echo "mode=apply" >> "$GITHUB_OUTPUT"; echo "MODE=APPLY (Backup + schreiben)"
            else
              echo "mode=dry-run" >> "$GITHUB_OUTPUT"; echo "MODE=DRY-RUN (Vorschau)"
            fi
          else
            # Auto: nur die ERSTE Zeile (Commit-Subject) auf den Marker pruefen.
            SUBJECT=$(printf '%s\n' "$HEAD_MSG" | head -1)
            if printf '%s' "$SUBJECT" | grep -qF '[publish-data]'; then
              echo "proceed=1" >> "$GITHUB_OUTPUT"; echo "mode=auto" >> "$GITHUB_OUTPUT"
              echo "Auto-Lauf ([publish-data] im Subject) — AUTO: wendet an, WENN 0 Konflikte; sonst haelt+meldet."
            else
              echo "proceed=0" >> "$GITHUB_OUTPUT"; echo "mode=none" >> "$GITHUB_OUTPUT"
              echo "Kein [publish-data] im Commit-Subject — kein Merge (no-op)."
            fi
          fi

      - id: auth
        if: steps.gate.outputs.proceed == '1'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - if: steps.gate.outputs.proceed == '1'
        uses: google-github-actions/setup-gcloud@v2

      # Backup, wenn geschrieben werden KANN (apply oder auto): die QUELL-STORES (JSON/YAML) nach
      # gs://…-backup/merge-<ts>/ sichern. (auto schreibt evtl. nicht — Backup schadet nie.)
      # BEWUSST OHNE `_generated/`: die PDFs/PNGs dort sind regenerierbar (docs-job), blaehen das
      # Backup massiv auf und racen mit gleichzeitigen docs-job-Writes (ein `cp -r` traf eine gerade
      # ersetzte Datei -> 404 -> Backup-Step failte -> Merge wurde uebersprungen). Der Merge fasst nur
      # die Stores an; nur die gehoeren ins Rollback-Backup. Top-Level-Glob `*.json`/`*.yaml` (kein -r)
      # laesst `_generated/` (Unterordner) sauber aus.
      - name: Backup Volume (apply/auto)
        if: steps.gate.outputs.proceed == '1' && (steps.gate.outputs.mode == 'apply' || steps.gate.outputs.mode == 'auto')
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          echo "Backup (Stores, ohne _generated) -> gs://${BACKUP_BUCKET}/merge-${TS}/"
          gcloud storage cp "gs://${BUCKET}/*.json" "gs://${BUCKET}/*.yaml" "gs://${BACKUP_BUCKET}/merge-${TS}/"

      # Modus in die Job-Args schreiben (--apply nur im Apply-Fall), dann Job ausfuehren.
      # Guard: ueberspringt sauber, falls der Job (noch) nicht existiert.
      - name: Merge-Job ausfuehren
        if: steps.gate.outputs.proceed == '1'
        run: |
          if ! gcloud run jobs describe "${JOB}" --project="${PROJECT_ID}" --region="${REGION}" >/dev/null 2>&1; then
            echo "${JOB} nicht gefunden — uebersprungen (erst anlegen, s. DEPLOYMENT_GCP §10)"
            exit 0
          fi
          case "${{ steps.gate.outputs.mode }}" in
            apply) ARGS="scripts/merge_bridge.py,--apply" ;;   # bewusster Apply (immer schreiben)
            auto)  ARGS="scripts/merge_bridge.py,--auto" ;;    # publiziert, WENN 0 Konflikte
            *)     ARGS="scripts/merge_bridge.py" ;;           # Dry-Run
          esac
          gcloud run jobs update "${JOB}" --project="${PROJECT_ID}" --region="${REGION}" \
            --command=python3 --args="${ARGS}"
          gcloud run jobs execute "${JOB}" --project="${PROJECT_ID}" --region="${REGION}" --wait

      # Merge-Zusammenfassung + Konflikte aus den Job-Logs sichtbar machen.
      - name: Merge-Zusammenfassung
        if: always() && steps.gate.outputs.proceed == '1'
        run: |
          echo "== Merge-Bruecke Logzeilen (Zusammenfassung / Konflikte) =="
          gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="rubicon-merge-job"' \
            --project="${PROJECT_ID}" --freshness=10m --limit=100 \
            --format="value(textPayload)" --order=asc \
            | grep -iE "merge|conflict|konflikt|stammdaten|transaktion|misch|\{" || echo "(keine Merge-Logzeilen gefunden)"
