  - code: WS3
    name: Overhead, Kosten & Kostenführerschaft
    owner: Stephanie Rohde
    support: Pajor, AFR (Finanz-Challenge + AAS-Technics-Turnaround), Wüst, Charisius
    ziel: 'Verbindlich ist das Ergebnis, nicht der Weg: Die Kostenbasis muss auf ein Niveau, das nachhaltige Profitabilität sichert. Basis ist Elysium (OPEX von EUR 23.83 Mio auf EUR 19.78 Mio, minus EUR 4.06 Mio); darauf der Zusatzhebel Zentralkosten minus 30% und externe Kosten minus 20% gegenüber Baseline, gemessen an der CFO-testierten Run-Rate mit Zwischen-Checkpoint. Reicht das nicht, gehen die Massnahmen weiter — die Tiefe des Eingriffs richtet sich nach dem Ziel, nicht umgekehrt. (DRS 07.08.2026: «Wir müssen tun, was nötig ist, um die Profitabilität zu sichern — egal ob radikal oder nicht.»)'
