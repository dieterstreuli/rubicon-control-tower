        name: 'Sofortmassnahmen ohne Zahlungswirkung sind in Kraft: eine Obergrenze für Zentralkosten gilt, neue Beraterverträge über EUR 25''000 brauchen Freigabe, und für jede Einheit ist benannt, wer das Ergebnis verantwortet'
